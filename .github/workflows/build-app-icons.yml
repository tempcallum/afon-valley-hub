name: Build Afon Valley Hub app icons

on:
  push:
    paths:
      - 'avfc-logo.jpg'
      - '.github/workflows/build-app-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare image conversion
        run: python -m pip install --quiet Pillow
      - name: Generate Android icon sizes from official club badge
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open('avfc-logo.jpg').convert('RGB')
          side = min(src.size)
          offx = (src.width-side)//2
          offy = (src.height-side)//2
          src = src.crop((offx,offy,offx+side,offy+side))
          for size in (192,512):
              icon=src.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(f'avfc-icon-{size}.png',format='PNG',optimize=True)
          PY
      - name: Commit refreshed icon images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avfc-icon-192.png avfc-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android PWA icons from existing club badge"
            git push
          fi
