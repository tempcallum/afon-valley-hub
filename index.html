async function eventDetails(id){const [{data:e,error},{data:rs},{data:pays}]=await Promise.all([sb.from('club_events').select('*').eq('id',id).single(),sb.from('event_responses').select('*,players(name)').eq('event_id',id),sb.from('event_payments').select('*').eq('event_id',id).eq('status','paid')]);if(error)return $('#eventBody').innerHTML='<div class="panel empty">'+esc(error.message)+'</div>';const pv=isPlayerView(),payMap=new Map();for(const p of pays||[])payMap.set(p.player_id,(payMap.get(p.player_id)||0)+Number(p.amount_pence));if(pv){if(!myPlayer)return $('#eventBody').innerHTML='<div class="panel empty">Your account is not linked to a player yet.</div>';const mine=(rs||[]).find(r=>r.player_id===myPlayer),paid=payMap.get(myPlayer)||0,due=Math.max(0,Number(e.price_pence)-paid);$('#eventBody').innerHTML='<div class="panel event-detail"><span class="eyebrow dark">CLUB EVENT</span><h3>'+esc(e.title)+'</h3><p class="event-when">'+day(e.event_date)+' · '+time(e.event_date)+(e.venue?' · '+esc(e.venue):'')+'</p>'+(e.description?'<p class="muted">'+esc(e.description)+'</p>':'')+'<div class="event-player-status"><div><small>Price</small><strong>'+(e.price_pence?cash(e.price_pence):'Free')+'</strong></div><div><small>My reply</small><strong>'+esc(mine?.response?mine.response.toUpperCase():'NOT SET')+'</strong></div><div><small>Payment</small><strong class="'+(due===0?'paid-text':'due-text')+'">'+(e.price_pence===0?'Not needed':due===0?'Paid':cash(due)+' due')+'</strong></div></div><form id="rsvpForm" class="form"><label>Can you attend?<select name="r"><option value="yes">Yes, I am coming</option><option value="maybe">Maybe</option><option value="no">No, I cannot make it</option></select></label><label>Note (optional)<input name="n" placeholder="Anything the club should know"></label><button class="btn primary">Save RSVP</button></form>'+(mine?.response==='yes'&&due>0?'<div class="payment-callout"><div><strong>Payment due: '+cash(due)+'</strong><span>Pay securely by card, Apple Pay or another method offered by Stripe.</span></div><button id="stripePay" class="btn yellow">Pay '+cash(due)+'</button></div>':'')+'</div>';$('#rsvpForm [name=r]').value=mine?.response||'yes';$('#rsvpForm [name=n]').value=mine?.note||'';$('#rsvpForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),{error}=await sb.from('event_responses').upsert({event_id:id,player_id:myPlayer,response:f.get('r'),note:String(f.get('n')||'').trim()||null,responded_at:new Date().toISOString()},{onConflict:'event_id,player_id'});error?alert(error.message):eventDetails(id)};if($('#stripePay'))$('#stripePay').onclick=async()=>{const b=$('#stripePay');b.disabled=true;b.textContent='Opening secure checkout…';const {data,error}=await sb.functions.invoke('create-event-checkout',{body:{event_id:id}});if(error||!data?.url){b.disabled=false;b.textContent='Pay '+cash(due);alert(data?.error||error?.message||'Could not start Stripe payment.');return}location.href=data.url};return}const yes=(rs||[]).filter(r=>r.response==='yes'),maybe=(rs||[]).filter(r=>r.response==='maybe'),no=(rs||[]).filter(r=>r.response==='no'),paidYes=yes.filter(r=>(payMap.get(r.player_id)||0)>=Number(e.price_pence)||Number(e.price_pence)===0),collected=(pays||[]).reduce((a,p)=>a+Number(p.amount_pence),0),canPay=['chair','treasurer'].includes(profile.role),canDeleteEvent=profile.role==='chair'&&!isPlayerView();$('#eventBody').innerHTML='<div class="panel event-detail"><div class="head"><div><span class="eyebrow dark">EVENT CONTROL</span><h3>'+esc(e.title)+'</h3><p class="event-when">'+day(e.event_date)+' · '+time(e.event_date)+(e.venue?' · '+esc(e.venue):'')+'</p></div><div class="event-head-actions"><span class="event-price">'+(e.price_pence?cash(e.price_pence):'Free')+'</span>'+(canDeleteEvent?'<button id="deleteEvent" class="btn danger-outline">Delete event</button>':'')+'</div></div>'+(e.description?'<p class="muted">'+esc(e.description)+'</p>':'')+'<div class="event-stats"><div><span>YES</span><strong>'+yes.length+'</strong></div><div><span>MAYBE</span><strong>'+maybe.length+'</strong></div><div><span>PAID</span><strong>'+paidYes.length+'/'+yes.length+'</strong></div><div><span>COLLECTED</span><strong>'+cash(collected)+'</strong></div></div><h3 style="margin-top:20px">Attending & payment</h3><div class="list">'+(yes.length?yes.map(r=>{const paid=payMap.get(r.player_id)||0,due=Math.max(0,Number(e.price_pence)-paid);return '<div class="event-attendee"><div><strong>'+esc(r.players?.name||'Player')+'</strong><small>'+(e.price_pence===0?'No payment required':due===0?'Paid in full':cash(due)+' remaining')+'</small></div><span class="badge '+(due===0?'ok':'warn')+'">'+(due===0?'PAID':'DUE')+'</span>'+(canPay&&due>0?'<button class="btn event-paybtn" data-pay-player="'+r.player_id+'" data-due="'+due+'">Record paid</button>':'')+'</div>'}).join(''):'<div class="empty">Nobody has said yes yet.</div>')+'</div>'+(maybe.length?'<h3 style="margin-top:18px">Maybe</h3><div class="actions">'+maybe.map(r=>'<span class="badge">'+esc(r.players?.name||'Player')+'</span>').join('')+'</div>':'')+'</div>';$('#eventBody').querySelectorAll('[data-pay-player]').forEach(b=>b.onclick=async()=>{const amount=Number(b.dataset.due),method=prompt('Payment method: bank transfer, cash, card or other','bank transfer');if(method===null)return;const clean=['bank transfer','cash','card','other'].includes(method.toLowerCase())?method.toLowerCase():'other';const {error}=await sb.from('event_payments').insert({event_id:id,player_id:Number(b.dataset.payPlayer),amount_pence:amount,method:clean,status:'paid',paid_at:new Date().toISOString(),recorded_by:user.id});error?alert(error.message):eventDetails(id)});if($('#deleteEvent'))$('#deleteEvent').onclick=async()=>{if(!confirm('Delete '+e.title+'? This will also remove its RSVPs and payment records.'))return;const {error}=await sb.from('club_events').delete().eq('id',id);if(error)return alert(error.message);events()}}
async function availability(){const [{data:ms},{data:cs}]=await Promise.all([sb.from('matches').select('*').order('match_date'),sb.from('club_settings').select('training_day,training_start,training_end').eq('id',1).maybeSingle()]),up=(ms||[]).filter(m=>new Date(m.match_date)>=new Date(Date.now()-86400000)),can=!isPlayerView()&&['chair','manager','facilities'].includes(profile.role),training=cs?.training_day?'<div class="training-banner schedule"><div><span class="eyebrow dark">TRAINING</span><strong>'+esc(cs.training_day)+' every week</strong><small>'+String(cs.training_start||'20:00').slice(0,5)+'–'+String(cs.training_end||'21:00').slice(0,5)+'</small></div><span class="badge ok">WEEKLY</span></div>':'';$('#content').innerHTML=training+(can?'<div class="panel"><div class="head"><h3>Fixtures</h3><button id="newm" class="btn primary">Add fixture</button></div></div>':'')+'<div class="panel"><h3>Upcoming fixtures</h3><div class="fixture-list">'+(up.length?up.map(m=>'<button class="fixture-row" data-m="'+m.id+'"><span class="fixture-date">'+day(m.match_date)+'</span><span class="fixture-team"><strong>'+esc(m.opponent)+'</strong><small>'+esc(m.home_away.toUpperCase())+' · '+fixtureClock(m)+((m.notes||'').includes('Junior Cup')?' · CUP':'')+'</small></span><i>›</i></button>').join(''):'<div class="empty">No upcoming fixtures added.</div>')+'</div></div><div id="mb"></div>';if($('#newm'))$('#newm').onclick=()=>{$('#mb').innerHTML='<div class="panel"><form id="mform" class="form-grid"><label>Date & time<input name="dt" type="datetime-local" required></label><label>Opponent<input name="o" required></label><label>Home/Away<select name="ha"><option value="home">Home</option><option value="away">Away</option><option value="neutral">Neutral</option></select></label><label>Venue<input name="v"></label><button class="btn primary">Save fixture</button></form></div>';$('#mform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('matches').insert({match_date:new Date(f.get('dt')).toISOString(),opponent:f.get('o'),home_away:f.get('ha'),venue:f.get('v'),created_by:user.id});error?alert(error.message):availability()}};$('#content').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>matchAv(Number(b.dataset.m)))}
async function matchAv(mid){if(isPlayerView()){if(!myPlayer)return $('#mb').innerHTML='<div class="panel empty">Your account is not linked to a player yet.</div>';const {data:r}=await sb.from('availability').select('*').eq('match_id',mid).eq('player_id',myPlayer).maybeSingle();$('#mb').innerHTML='<div class="panel"><form id="av" class="form"><label>Status<select name="s"><option value="available">Available</option><option value="maybe">Maybe</option><option value="unavailable">Unavailable</option></select></label><label>Note<input name="n"></label><button class="btn primary">Save</button></form></div>';$('#av [name=s]').value=r?.status||'available';$('#av [name=n]').value=r?.note||'';$('#av').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('availability').upsert({match_id:mid,player_id:myPlayer,status:f.get('s'),note:f.get('n')},{onConflict:'match_id,player_id'});error?alert(error.message):alert('Availability saved')};return}const [{data:ps},{data:rs}]=await Promise.all([sb.from('players').select('id,name').eq('status','active').order('name'),sb.from('availability').select('*').eq('match_id',mid)]),m=new Map((rs||[]).map(x=>[x.player_id,x.status]));$('#mb').innerHTML='<div class="panel"><div class="table"><table><thead><tr><th>Player</th><th>Status</th></tr></thead><tbody>'+(ps||[]).map(p=>'<tr><td>'+esc(p.name)+'</td><td><span class="badge '+(m.get(p.id)==='available'?'ok':m.get(p.id)==='unavailable'?'bad':'warn')+'">'+esc(m.get(p.id)||'unknown')+'</span></td></tr>').join('')+'</tbody></table></div></div>'}

async function editE(pid){const [{data:p},{data:e,error}]=await Promise.all([sb.from('players').select('id,name').eq('id',pid).single(),sb.rpc('get_emergency_details',{target_player_id:pid})]);if(error)return $('#content').innerHTML='<div class="panel empty">'+esc(error.message)+'</div>';const d=e?.[0]||{};$('#content').innerHTML='<div class="privacy"><strong>Restricted information</strong><span>For genuine player safety and emergencies only.</span></div><div class="panel"><h3>'+esc(p.name)+' emergency details</h3><form id="ef" class="form"><label>Primary contact<input name="pn" value="'+esc(d.primary_name||'')+'"></label><label>Relationship<input name="pr" value="'+esc(d.primary_relationship||'')+'"></label><label>Phone<input name="pp" value="'+esc(d.primary_phone||'')+'"></label><label>Second contact<input name="sn" value="'+esc(d.secondary_name||'')+'"></label><label>Relationship<input name="sr" value="'+esc(d.secondary_relationship||'')+'"></label><label>Phone<input name="sp" value="'+esc(d.secondary_phone||'')+'"></label><label>Medical / emergency information<textarea name="mn">'+esc(d.medical_notes||'')+'</textarea></label><button class="btn primary">Save emergency details</button></form></div>';$('#ef').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.rpc('save_emergency_details',{target_player_id:pid,p_primary_name:f.get('pn'),p_primary_relationship:f.get('pr'),p_primary_phone:f.get('pp'),p_secondary_name:f.get('sn'),p_secondary_relationship:f.get('sr'),p_secondary_phone:f.get('sp'),p_medical_notes:f.get('mn')});error?alert(error.message):alert('Emergency details saved')}}

tings?.shop_url||'')+'"></label><label>Button name<input name="label" value="'+esc(settings?.shop_label||'Club Shop')+'"></label><button class="btn primary">Save shop link</button></form></div>';for(const u of us||[]){$('[data-r="'+u.id+'"]').value=u.role;$('[data-a="'+u.id+'"]').value=String(u.approved);const l=(ps||[]).find(p=>p.user_id===u.id);$('[data-p="'+u.id+'"]').value=l?String(l.id):''}$('#content').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,pv=$('[data-p="'+id+'"]').value,{error}=await sb.rpc('admin_set_user',{target_user:id,new_role:$('[data-r="'+id+'"]').value,is_approved:$('[data-a="'+id+'"]').value==='true',link_player_id:pv?Number(pv):null});error?alert(error.message):admin()});$('#adminShopForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),u=String(f.get('url')||'').trim();if(u&&!/^https?:\/\//i.test(u))return alert('The shop link needs to start with http:// or https://');const {error}=await sb.from('club_settings').update({shop_url:u||null,shop_label:String(f.get('label')||'Club Shop').trim()||'Club Shop',updated_at:new Date().toISOString(),updated_by:user.id}).eq('id',1);error?alert(error.message):alert('Club shop link saved')}}
