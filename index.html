<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07532f"><meta name="apple-mobile-web-app-capable" content="yes"><title>Afon Valley Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0b5f38;--gd:#063a23;--y:#f4cf42;--bg:#f2f7f3;--ink:#17231b;--muted:#6c776f;--line:#d9e3dc;--bad:#a93636;--warn:#8c6916;--ok:#147243}*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;background:linear-gradient(180deg,#eaf4ed,#f7faf8 240px,#f3f7f4);min-height:100vh}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:radial-gradient(circle at top,#168653,#0b5f38 42%,#05331f)}.login-card{width:min(100%,430px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.logo{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--gd);border:4px solid var(--y);color:var(--y);font-weight:1000;font-size:25px}.login h1{text-align:center;font-size:38px;line-height:1;margin:5px 0;color:var(--gd)}.kicker{text-align:center;color:var(--g);font-size:11px;font-weight:900;letter-spacing:.14em;margin:0}.copy{text-align:center;color:var(--muted);margin:8px 0 20px}.switch{display:flex;background:#eef4f0;padding:4px;border-radius:14px;margin-bottom:14px}.switch button{flex:1;border:0;border-radius:10px;padding:9px;background:transparent;font-weight:900}.switch button.active{background:#fff;color:var(--g);box-shadow:0 2px 8px #0001}.stack,.form{display:grid;gap:12px}label{font-size:13px;font-weight:800}input,select,textarea{width:100%;min-height:46px;border:1px solid #bcc8c0;border-radius:12px;padding:10px 11px;margin-top:6px;background:#fff;color:var(--ink)}textarea{min-height:96px}.msg{min-height:20px;font-size:13px;color:var(--bad);margin:10px 0 0}.success{color:var(--ok)}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#05331f,#0b5f38 65%,#14764a);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 18px #0003}.brand{display:flex;align-items:center;gap:10px}.mini{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--gd);border:2px solid var(--y);color:var(--y);font-weight:1000;font-size:12px}.brand strong,.brand span{display:block}.brand span{font-size:12px;opacity:.78}.topbtn{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:999px;padding:9px 12px;font-weight:800}main{max-width:1100px;margin:auto;padding:14px 12px 80px}.hero{background:linear-gradient(135deg,#064228,#0b6d40);color:#fff;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px #053a232e}.hero h2{font-size:29px;margin:2px 0 5px}.hero p{margin:0;color:#dceae1}.ball{font-size:46px}.nav{display:flex;gap:7px;overflow:auto;padding:13px 1px 10px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;min-height:44px;font-weight:900}.nav button.active{background:var(--g);border-color:var(--g);color:#fff}.content{display:grid;gap:12px}.grid{display:grid;gap:12px}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 6px 16px #0429190d}.stat{position:relative;overflow:hidden}.stat:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--y)}.stat small{color:var(--muted);font-weight:800}.stat strong{display:block;color:var(--gd);font-size:28px;margin-top:6px}.panel h3{margin:0 0 12px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.head h3{margin:0}.muted{color:var(--muted)}.btn{border:1px solid #b9c7be;background:#fff;border-radius:12px;min-height:44px;padding:9px 13px;font-weight:900}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.btn.yellow{background:var(--y);border-color:#deb833;color:#3f3300}.actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef3ef;font-size:12px;font-weight:900}.ok{background:#e8f6ed;color:var(--ok)}.warn{background:#fff5d7;color:var(--warn)}.bad{background:#faeaea;color:var(--bad)}.list{display:grid}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:20px}.privacy{border-left:5px solid var(--g);background:#eef6f1;border-radius:14px;padding:13px 14px}.privacy strong{display:block}.fixture{padding:14px;background:#f2f7f3;border:1px solid var(--line);border-radius:16px}.fixture strong{font-size:18px}.fixture small{display:block;color:var(--muted);margin-top:4px}@media(max-width:760px){.three,.two,.form-grid{grid-template-columns:1fr}.hero h2{font-size:26px}.ball{font-size:38px}.stat strong{font-size:25px}}
.club-strip{background:linear-gradient(135deg,#063a23,#0b5f38);color:#fff;border:1px solid #0b5f38}.club-strip .kicker{color:#f4cf42;text-align:left}.club-strip h3{font-size:23px;margin:3px 0 6px}.club-strip p{margin:0;color:#dceae1}.kit-dots{display:flex;gap:8px;margin-top:12px}.kit-dot{display:inline-flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff2b;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #ffffff80}.dot.green{background:#0b5f38}.dot.yellow{background:#f4cf42}.shop-hero{background:linear-gradient(135deg,#063a23,#0b5f38);color:#fff;text-align:center;padding:26px 18px}.shop-hero img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #f4cf42;box-shadow:0 8px 22px #0003}.shop-hero h3{font-size:27px;margin:12px 0 6px}.shop-hero p{color:#dceae1;margin:0 auto 16px;max-width:520px}a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.logo,.mini{object-fit:cover}.shop-note{background:#fff8db;border:1px solid #ead37c;border-radius:14px;padding:12px 14px;color:#66520c}

const sb=supabase.createClient("https://isljjtspkqsyhkjmmhiq.supabase.co","sb_publishable_j7WOkbvabstVJEmfh5zWbQ_NgE0jhjJ"),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),cash=p=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format((Number(p)||0)/100),day=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';let user,profile,myPlayer,mode='login',tab='home';
const tabs={chair:['home','shop','players','money','fines','kit','attendance','availability','emergency','admin'],treasurer:['home','shop','players','money','kit'],manager:['home','shop','players','kit','attendance','availability','emergency'],fines:['home','shop','players','fines','kit'],safeguarding:['home','shop','players','emergency'],player:['home','shop','money','kit','availability','emergency']},labels={home:'Home',shop:'Club Shop',players:'Players',money:'Money',fines:'Fines',kit:'Kit',attendance:'Attendance',availability:'Availability',emergency:'Emergency',admin:'Admin'};
function setMode(n){mode=n;$('#lm').classList.toggle('active',n==='login');$('#sm').classList.toggle('active',n==='signup');$('#nl').classList.toggle('hidden',n!=='signup');$('#ab').textContent=n==='login'?'Log in':'Create account';$('#msg').textContent=''}$('#lm').onclick=()=>setMode('login');$('#sm').onclick=()=>setMode('signup');
$('#auth').onsubmit=async e=>{e.preventDefault();$('#msg').className='msg';let error;if(mode==='login')({error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}));else{const n=$('#dn').value.trim();if(!n)return $('#msg').textContent='Enter your name.';({error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{display_name:n},emailRedirectTo:'https://tempcallum.github.io/afon-valley-hub/'}}));if(!error){$('#msg').className='msg success';$('#msg').textContent='Account created. Check your email if confirmation is requested, then log in. New accounts wait for Chair approval.';return}}$('#msg').textContent=error?error.message:''};$('#out').onclick=()=>sb.auth.signOut();
async function boot(){const {data:{session}}=await sb.auth.getSession();session?.user?await enter(session.user):showLogin();sb.auth.onAuthStateChange(async(_,s)=>s?.user?await enter(s.user):showLogin())}function showLogin(){$('#shell').classList.add('hidden');$('#login').classList.remove('hidden')}
async function enter(u){user=u;const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();profile=p;$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');if(!p)return $('#content').innerHTML='<div class="panel empty">Finishing account setup…</div>';$('#hi').textContent='Hi '+p.display_name;if(!p.approved){$('#sub').textContent='Your account is waiting for club approval.';$('#nav').innerHTML='';$('#content').innerHTML='<div class="panel"><h3>Account waiting for approval</h3><p>The Chair needs to approve your account and link it to your player record.</p><button class="btn" id="refresh">Check again</button></div>';$('#refresh').onclick=()=>enter(user);return}const {data:pid}=await sb.rpc('my_player_id');myPlayer=pid||null;$('#sub').textContent=p.role==='player'?'Your Afon Valley season at a glance.':'Club admin, players and matchday in one place.';drawNav();render(tab)}

async function players(){const {data}=await sb.from('players').select('*').order('name'),can=['chair','manager'].includes(profile.role);$('#content').innerHTML='<div class="panel"><div class="head"><h3>Players</h3>'+(can?'<button id="addp" class="btn primary">Add player</button>':'')+'</div><div class="table"><table><thead><tr><th>Player</th><th>No.</th><th>Status</th></tr></thead><tbody>'+(data||[]).map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(p.shirt_no??'—')+'</td><td><span class="badge '+(p.status==='active'?'ok':'warn')+'">'+esc(p.status)+'</span></td></tr>').join('')+'</tbody></table></div></div>';if($('#addp'))$('#addp').onclick=()=>{$('#content').insertAdjacentHTML('afterbegin','<div class="panel"><form id="pf" class="form-grid"><label>Name<input name="name" required></label><label>Shirt no.<input name="shirt"></label><label>Status<select name="status"><option>active</option><option>injured</option><option>left</option></select></label><button class="btn primary">Save player</button></form></div>');$('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('players').insert({name:f.get('name'),shirt_no:f.get('shirt')?Number(f.get('shirt')):null,status:f.get('status'),created_by:user.id});error?alert(error.message):players()}}}
async function money(){const isP=profile.role==='player';const [{data:bs},{data:ls},{data:ps}]=await Promise.all([sb.from('player_balances').select('*').order('player_name'),sb.from('ledger').select('*,players(name)').order('entry_date',{ascending:false}).limit(100),sb.from('players').select('id,name').eq('status','active').order('name')]);const vb=isP?(bs||[]).filter(x=>x.player_id===myPlayer):(bs||[]);$('#content').innerHTML=(isP?'':'<div class="panel"><div class="head"><h3>Subs & payments</h3><button id="all" class="btn yellow">Charge whole squad</button></div><form id="mf" class="form-grid"><label>Player<select name="p">'+(ps||[]).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>Type<select name="type"><option value="charge">Charge</option><option value="payment">Payment</option></select></label><label>Amount £<input name="a" required></label><label>Description<input name="d" placeholder="Monthly subs"></label><label>Method<select name="m"><option>bank transfer</option><option>cash</option><option>other</option></select></label><button class="btn primary">Save</button></form></div>')+'<div class="grid two"><div class="panel"><h3>'+(isP?'My balance':'Player balances')+'</h3><div class="list">'+vb.map(x=>'<div class="row"><span>'+esc(x.player_name)+'</span><strong>'+cash(x.balance_pence)+'</strong></div>').join('')+'</div></div><div class="panel"><h3>Recent activity</h3><div class="list">'+(ls||[]).map(x=>'<div class="row"><span>'+esc(x.players?.name||'Player')+'<br><small class="muted">'+esc(x.description)+'</small></span><strong>'+(x.direction==='payment'?'-':'')+cash(x.amount_pence)+'</strong></div>').join('')+'</div></div></div>';if($('#mf'))$('#mf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),a=Math.round(Number(f.get('a'))*100),{error}=await sb.from('ledger').insert({player_id:Number(f.get('p')),direction:f.get('type'),category:'subs',amount_pence:a,description:f.get('d')||'Club transaction',method:f.get('m'),created_by:user.id});error?alert(error.message):money()};if($('#all'))$('#all').onclick=async()=>{const a=Math.round(Number(prompt('Subs amount (£)'))*100),d=prompt('Description','Monthly subs');if(!(a>0)||d===null)return;const {error}=await sb.rpc('charge_all_active_players',{charge_amount_pence:a,charge_description:d,charge_category:'subs'});error?alert(error.message):money()}}
async function fines(){const [{data:ps},{data:ls}]=await Promise.all([sb.from('players').select('id,name').eq('status','active').order('name'),sb.from('ledger').select('*,players(name)').eq('category','fine').order('entry_date',{ascending:false})]);$('#content').innerHTML='<div class="panel"><h3>Add fine</h3><form id="ff" class="form-grid"><label>Player<select name="p">'+(ps||[]).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>Amount £<input name="a" required></label><label>Reason<input name="d" required></label><button class="btn yellow">Add fine</button></form></div><div class="panel"><h3>Fine history</h3><div class="list">'+(ls||[]).map(x=>'<div class="row"><span>'+esc(x.players?.name||'Player')+'<br><small class="muted">'+esc(x.description)+'</small></span><strong>'+cash(x.amount_pence)+'</strong></div>').join('')+'</div></div>';$('#ff').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('ledger').insert({player_id:Number(f.get('p')),direction:'charge',category:'fine',amount_pence:Math.round(Number(f.get('a'))*100),description:f.get('d'),created_by:user.id});error?alert(error.message):fines()}}
async function kit(){const [{data:ps},{data:ws}]=await Promise.all([sb.from('players').select('id,name').eq('status','active').order('name'),sb.from('kit_washes').select('*')]);const c=new Map();(ws||[]).forEach(w=>c.set(w.player_id,(c.get(w.player_id)||0)+1));const r=(ps||[]).map(p=>({...p,n:c.get(p.id)||0})).sort((a,b)=>a.n-b.n||a.name.localeCompare(b.name)),can=profile.role!=='player';$('#content').innerHTML='<div class="grid two"><div class="panel"><h3>Next suggested washer</h3>'+(r[0]?'<strong style="font-size:25px">'+esc(r[0].name)+'</strong><p class="muted">'+r[0].n+' washes logged.</p>':'<div class="empty">Add players first.</div>')+'</div><div class="panel"><h3>Kit wash tracker</h3><div class="list">'+r.map(p=>'<div class="row"><span>'+esc(p.name)+'</span><strong>'+p.n+'</strong></div>').join('')+'</div></div></div>'+(can?'<div class="panel"><form id="kf" class="form-grid"><label>Player<select name="p">'+r.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>Match / note<input name="n"></label><button class="btn primary">Log wash</button></form></div>':'');if($('#kf'))$('#kf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('kit_washes').insert({player_id:Number(f.get('p')),match_label:f.get('n'),logged_by:user.id});error?alert(error.message):kit()}}
async function attendance(){const [{data:ss},{data:ps}]=await Promise.all([sb.from('training_sessions').select('*').order('session_date',{ascending:false}).limit(10),sb.from('players').select('id,name').eq('status','active').order('name')]);$('#content').innerHTML='<div class="panel"><div class="head"><h3>Training attendance</h3><button id="news" class="btn primary">New session</button></div><div class="actions">'+(ss||[]).map(s=>'<button class="btn" data-s="'+s.id+'">'+day(s.session_date)+' · '+esc(s.title)+'</button>').join('')+'</div></div><div id="att"></div>';$('#news').onclick=()=>{$('#att').innerHTML='<div class="panel"><form id="sf" class="form-grid"><label>Date<input type="date" name="d" required></label><label>Title<input name="t" value="Training"></label><button class="btn primary">Create</button></form></div>';$('#sf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('training_sessions').insert({session_date:f.get('d'),title:f.get('t')||'Training',created_by:user.id});error?alert(error.message):attendance()}};$('#content').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>loadAtt(Number(b.dataset.s),ps||[]))}
async function loadAtt(id,ps){const {data:rs}=await sb.from('attendance').select('*').eq('session_id',id),m=new Map((rs||[]).map(x=>[x.player_id,x.status]));$('#att').innerHTML='<div class="panel"><div class="list">'+ps.map(p=>'<div class="row"><span>'+esc(p.name)+'</span><select data-p="'+p.id+'" style="max-width:150px;margin:0"><option value="unknown">Unknown</option><option value="present">Present</option><option value="absent">Absent</option><option value="injured">Injured</option></select></div>').join('')+'</div><button id="savea" class="btn primary">Save attendance</button></div>';$('#att').querySelectorAll('select').forEach(s=>s.value=m.get(Number(s.dataset.p))||'unknown');$('#savea').onclick=async()=>{const rows=[...$('#att').querySelectorAll('select')].map(s=>({session_id:id,player_id:Number(s.dataset.p),status:s.value})),{error}=await sb.from('attendance').upsert(rows,{onConflict:'session_id,player_id'});error?alert(error.message):alert('Attendance saved')}}
async function availability(){const {data:ms}=await sb.from('matches').select('*').order('match_date'),up=(ms||[]).filter(m=>new Date(m.match_date)>=new Date(Date.now()-86400000)),can=['chair','manager'].includes(profile.role);$('#content').innerHTML=(can?'<div class="panel"><div class="head"><h3>Fixtures</h3><button id="newm" class="btn primary">Add fixture</button></div></div>':'')+'<div class="panel"><h3>Upcoming fixtures</h3><div class="actions">'+up.map(m=>'<button class="btn" data-m="'+m.id+'">'+day(m.match_date)+' · '+esc(m.opponent)+'</button>').join('')+'</div></div><div id="mb"></div>';if($('#newm'))$('#newm').onclick=()=>{$('#mb').innerHTML='<div class="panel"><form id="mform" class="form-grid"><label>Date & time<input name="dt" type="datetime-local" required></label><label>Opponent<input name="o" required></label><label>Home/Away<select name="ha"><option value="home">Home</option><option value="away">Away</option><option value="neutral">Neutral</option></select></label><label>Venue<input name="v"></label><button class="btn primary">Save fixture</button></form></div>';$('#mform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('matches').insert({match_date:new Date(f.get('dt')).toISOString(),opponent:f.get('o'),home_away:f.get('ha'),venue:f.get('v'),created_by:user.id});error?alert(error.message):availability()}};$('#content').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>matchAv(Number(b.dataset.m)))}
async function matchAv(mid){if(profile.role==='player'){if(!myPlayer)return $('#mb').innerHTML='<div class="panel empty">Your account is not linked to a player yet.</div>';const {data:r}=await sb.from('availability').select('*').eq('match_id',mid).eq('player_id',myPlayer).maybeSingle();$('#mb').innerHTML='<div class="panel"><form id="av" class="form"><label>Status<select name="s"><option value="available">Available</option><option value="maybe">Maybe</option><option value="unavailable">Unavailable</option></select></label><label>Note<input name="n"></label><button class="btn primary">Save</button></form></div>';$('#av [name=s]').value=r?.status||'available';$('#av [name=n]').value=r?.note||'';$('#av').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('availability').upsert({match_id:mid,player_id:myPlayer,status:f.get('s'),note:f.get('n')},{onConflict:'match_id,player_id'});error?alert(error.message):alert('Availability saved')};return}const [{data:ps},{data:rs}]=await Promise.all([sb.from('players').select('id,name').eq('status','active').order('name'),sb.from('availability').select('*').eq('match_id',mid)]),m=new Map((rs||[]).map(x=>[x.player_id,x.status]));$('#mb').innerHTML='<div class="panel"><div class="table"><table><thead><tr><th>Player</th><th>Status</th></tr></thead><tbody>'+(ps||[]).map(p=>'<tr><td>'+esc(p.name)+'</td><td><span class="badge '+(m.get(p.id)==='available'?'ok':m.get(p.id)==='unavailable'?'bad':'warn')+'">'+esc(m.get(p.id)||'unknown')+'</span></td></tr>').join('')+'</tbody></table></div></div>'}
async function emergency(){if(profile.role==='player'){if(!myPlayer)return $('#content').innerHTML='<div class="panel empty">Your account is not linked to a player yet.</div>';return editE(myPlayer)}const {data:ps}=await sb.from('players').select('id,name').eq('status','active').order('name');$('#content').innerHTML='<div class="privacy"><strong>Restricted emergency information</strong><span>Only the player, Chair, Manager and Safeguarding Officer can access it.</span></div><div class="panel"><div class="actions">'+(ps||[]).map(p=>'<button class="btn" data-e="'+p.id+'">'+esc(p.name)+'</button>').join('')+'</div></div>';$('#content').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editE(Number(b.dataset.e)))}
async function editE(pid){const [{data:p},{data:e,error}]=await Promise.all([sb.from('players').select('id,name').eq('id',pid).single(),sb.rpc('get_emergency_details',{target_player_id:pid})]);if(error)return $('#content').innerHTML='<div class="panel empty">'+esc(error.message)+'</div>';const d=e?.[0]||{};$('#content').innerHTML='<div class="privacy"><strong>Restricted information</strong><span>For genuine player safety and emergencies only.</span></div><div class="panel"><h3>'+esc(p.name)+' emergency details</h3><form id="ef" class="form"><label>Primary contact<input name="pn" value="'+esc(d.primary_name||'')+'"></label><label>Relationship<input name="pr" value="'+esc(d.primary_relationship||'')+'"></label><label>Phone<input name="pp" value="'+esc(d.primary_phone||'')+'"></label><label>Second contact<input name="sn" value="'+esc(d.secondary_name||'')+'"></label><label>Relationship<input name="sr" value="'+esc(d.secondary_relationship||'')+'"></label><label>Phone<input name="sp" value="'+esc(d.secondary_phone||'')+'"></label><label>Medical / emergency information<textarea name="mn">'+esc(d.medical_notes||'')+'</textarea></label><button class="btn primary">Save emergency details</button></form></div>';$('#ef').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.rpc('save_emergency_details',{target_player_id:pid,p_primary_name:f.get('pn'),p_primary_relationship:f.get('pr'),p_primary_phone:f.get('pp'),p_secondary_name:f.get('sn'),p_secondary_relationship:f.get('sr'),p_secondary_phone:f.get('sp'),p_medical_notes:f.get('mn')});error?alert(error.message):alert('Emergency details saved')}}
async function admin(){const [{data:us},{data:ps}]=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('players').select('id,name,user_id').order('name')]);$('#content').innerHTML='<div class="panel"><h3>Accounts & permissions</h3><p class="muted">Approve accounts, assign roles and link players.</p><div class="table"><table><thead><tr><th>User</th><th>Role</th><th>Approved</th><th>Player link</th><th></th></tr></thead><tbody>'+(us||[]).map(u=>'<tr><td><strong>'+esc(u.display_name)+'</strong><br><small>'+esc(u.email||'')+'</small></td><td><select data-r="'+u.id+'"><option value="player">Player</option><option value="manager">Manager</option><option value="treasurer">Treasurer</option><option value="fines">Fines</option><option value="safeguarding">Safeguarding</option><option value="chair">Chair</option></select></td><td><select data-a="'+u.id+'"><option value="false">No</option><option value="true">Yes</option></select></td><td><select data-p="'+u.id+'"><option value="">None</option>'+(ps||[]).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></td><td><button class="btn primary" data-save="'+u.id+'">Save</button></td></tr>').join('')+'</tbody></table></div></div>';for(const u of us||[]){$('[data-r="'+u.id+'"]').value=u.role;$('[data-a="'+u.id+'"]').value=String(u.approved);const l=(ps||[]).find(p=>p.user_id===u.id);$('[data-p="'+u.id+'"]').value=l?String(l.id):''}$('#content').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,pv=$('[data-p="'+id+'"]').value,{error}=await sb.rpc('admin_set_user',{target_user:id,new_role:$('[data-r="'+id+'"]').value,is_approved:$('[data-a="'+id+'"]').value==='true',link_player_id:pv?Number(pv):null});error?alert(error.message):admin()})}
boot();
